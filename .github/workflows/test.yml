name: test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v4
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - v4

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-all
